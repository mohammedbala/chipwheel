name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        timeout-minutes: 70        # v3 branch: stop a stuck flow so the logs below survive
        with:
          pdk: ihp-sg13cmos5l

      - name: Flow progress (v3 branch debugging)
        if: always()
        shell: bash
        run: |
          ls -la --time-style=+%H:%M:%S runs/wokwi/ || true
          last=$(ls -d runs/wokwi/[0-9]*-* 2>/dev/null | sort -V | tail -1)
          echo "LAST STEP: $last"
          for f in "$last"/*.log; do echo "== $f"; tail -120 "$f"; done || true

      - name: Upload partial flow logs (v3 branch debugging)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flow_logs_partial
          path: |
            runs/wokwi/*/*.log
            runs/wokwi/*/*.rpt
            runs/wokwi/*/*/*.rpt
            runs/wokwi/*/state_in.json

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l
